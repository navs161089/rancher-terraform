# Ubuntu's default chrony.conf ships `makestep 1 3` — step-correct the
# clock only for the first 3 updates after chronyd starts, slew-only
# after that. That's fine for a physical server that reboots rarely,
# but this lab runs on VMs that get paused/suspended (e.g. the host
# Mac sleeping) — the guest clock freezes for the pause duration, and
# by the time chronyd notices, its 3-step allowance is long since used
# up, leaving it permanently unable to correct a multi-hour gap via
# slew alone. `-1` removes the update-count limit: step-correct
# whenever the offset exceeds 1 second, for the life of the daemon.
#
# Discovered live, not anticipated: rke-slave1's clock drifted 46
# hours behind real time this way, and every new pod's ServiceAccount
# token validation against the (correctly-clocked) API server failed
# as "Unauthorized" until this was fixed — a silent, hard-to-diagnose
# failure mode for something as mundane as a laptop going to sleep.
makestep 1 -1
